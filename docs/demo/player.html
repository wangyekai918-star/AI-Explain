<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 讲解 · IP 形象</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:#202b3d;font:15px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}main{max-width:880px;margin:24px auto;padding:0 24px}.badge{color:#357359;background:#e8f5ed;padding:5px 12px;border-radius:20px;font-size:12px}h1{font-size:24px;margin:16px 0 8px}p{color:#687386}.card{margin-top:18px;padding:20px;background:white;border:1px solid #e5e9ef;border-radius:20px}.stats{display:flex;gap:40px;margin:24px 0}.stats strong{display:block;font-size:28px}.stats span{font-size:13px;color:#687386}button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 18px;background:#3169ed;color:white}button.secondary{background:#eaf0fd;color:#3169ed;margin-left:8px}#status{font-size:13px;color:#687386;margin-top:16px}@media(max-width:600px){main{margin-top:36px}.stats{gap:20px}h1{font-size:28px}}
  .source-controls{display:flex;align-items:center;flex-wrap:wrap;gap:12px;font-size:14px}.source-controls label{display:flex;align-items:center;gap:6px}.source-controls input,.source-controls select{font:inherit;padding:6px;border:1px solid #ddd;border-radius:6px}.demo-failure{color:#687386;font-size:12px}.theme-picker{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:20px;padding-top:16px;border-top:1px solid #eef0f3}.theme-picker-label{flex-basis:100%;font-size:13px;color:#687386;margin-bottom:2px}.theme-swatch{display:inline-flex;align-items:center;gap:6px;background:#fff;color:#535b65;border:1px solid #e5e7eb;padding:6px 9px;border-radius:9px;font-size:13px;line-height:1.5}.theme-swatch[aria-pressed="true"]{border-color:#202322;color:#202322;box-shadow:0 0 0 1px #202322}.theme-swatch-dot{width:12px;height:12px;border-radius:50%;display:block}.theme-swatch:focus-visible{outline:2px solid #687386;outline-offset:3px}</style>
  <script type="module" crossorigin src="../assets/main-BciXVIgx.js"></script>
  <link rel="stylesheet" crossorigin href="../assets/main-BLP6mkSr.css">
</head>
<body>
  <main>
    <span class="badge">本地演示 · 模拟数据</span>
    <h1>充电站经营数据</h1>
    <p>点击右下角 IP 形象开始讲解，展开后可查看字幕并输入问题。</p>
    <section class="card">
      <h2>充电站经营概览</h2>
      <p>以下为演示数据，用于体验组件交互。</p>
      <div class="stats"><div><strong>128</strong><span>充电订单 / 单</span></div><div><strong>2,560</strong><span>充电量 / 度</span></div><div><strong>8%</strong><span>订单环比增长</span></div></div>
      <div class="demo-actions"><label class="mode-control" for="theme"><span>深色模式</span><input id="theme" type="checkbox" role="switch" aria-label="深色模式"><span class="mode-track" aria-hidden="true"></span></label></div>
    </section>
    <p>讲解和追问回答使用预设内容，语音使用浏览器朗读。真实 AI 生成、后端音色和语音识别需连接业务服务。</p>
  </main>
</body>
</html>
